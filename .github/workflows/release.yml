name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: opendembow
            output_name: opendembow-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: opendembow.exe
            output_name: opendembow-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: opendembow
            output_name: opendembow-macos-amd64

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances système (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Compiler en mode Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Renommer le binaire
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.output_name }}

      - name: Publier la Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}